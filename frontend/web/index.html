<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SpendSense - a personal budgeting app. Web demo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SpendSense">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SpendSense - Web Demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #1f2937 0%, #0b1120 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Device-style frame around the Flutter canvas so the demo reads as a
       phone app rather than a full-width responsive website when the URL
       is opened directly in a desktop browser. */
    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100dvh;
      box-sizing: border-box;
      background: #000;
      border-radius: 44px;
      padding: 12px;
      box-shadow:
        0 40px 80px -20px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #000;
    }

    #flutter-host {
      width: 100%;
      height: 100%;
    }

    /* On actual touch devices (phones/tablets) the frame chrome would just
       waste screen space and shrink the app - give them the real thing
       full-bleed instead of a phone-in-a-phone. */
    @media (pointer: coarse) {
      body {
        background: #000;
      }

      .phone-frame {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      .phone-screen {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <div id="flutter-host"></div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
